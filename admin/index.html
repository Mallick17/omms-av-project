<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMM Audio Visuals - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .login-box {
            background: #0f3460;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #e94560;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #1a1a2e;
            color: #eee;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #e94560;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #d63850;
        }

        .btn-secondary {
            background: #0f3460;
        }

        .btn-secondary:hover {
            background: #16213e;
        }

        .btn-danger {
            background: #e94560;
        }

        .btn-danger:hover {
            background: #d63850;
        }

        .admin-panel {
            display: none;
        }

        .sidebar {
            width: 250px;
            background: #0f3460;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px;
        }

        .sidebar h2 {
            color: #e94560;
            margin-bottom: 30px;
        }

        .sidebar nav button {
            display: block;
            width: 100%;
            padding: 15px;
            background: none;
            border: none;
            color: #ccc;
            text-align: left;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .sidebar nav button:hover,
        .sidebar nav button.active {
            background: #e94560;
            color: white;
        }

        .sidebar nav button.logout {
            margin-top: 30px;
            background: #e94560;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .section-header h2 {
            color: #e94560;
        }

        .card {
            background: #0f3460;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .card h3 {
            margin-bottom: 15px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .table th,
        .table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        .table th {
            background: #16213e;
            color: #e94560;
        }

        .table tr:hover {
            background: #16213e;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .actions button {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .edit-btn {
            background: #4CAF50;
            color: white;
        }

        .delete-btn {
            background: #e94560;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0f3460;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #e94560;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 24px;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #e94560;
        }

        .image-preview {
            width: 100%;
            height: 200px;
            background: #1a1a2e;
            border: 2px dashed #333;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .image-preview span {
            color: #666;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #4CAF50;
            color: white;
        }

        .alert.error {
            background: #e94560;
            color: white;
        }

        .alert.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div class="login-container" id="loginPage">
        <div class="login-box">
            <h1>OMM Audio Visuals</h1>
            <div class="alert" id="loginAlert"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <div class="sidebar">
            <h2>Admin Panel</h2>
            <nav>
                <button class="active" onclick="showSection('equipment')">Equipment</button>
                <button onclick="showSection('categories')">Categories</button>
                <button onclick="showSection('events')">Events</button>
                <button class="logout" onclick="logout()">Logout</button>
            </nav>
        </div>

        <div class="main-content">
            <div class="alert" id="alert"></div>

            <!-- Equipment Section -->
            <div class="section active" id="equipmentSection">
                <div class="section-header">
                    <h2>Equipment Management</h2>
                    <button class="btn" style="width: auto;" onclick="openEquipmentModal()">Add Equipment</button>
                </div>
                <div class="card">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="equipmentTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Categories Section -->
            <div class="section" id="categoriesSection">
                <div class="section-header">
                    <h2>Categories</h2>
                    <button class="btn" style="width: auto;" onclick="openCategoryModal()">Add Category</button>
                </div>
                <div class="card">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Icon</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Events Section -->
            <div class="section" id="eventsSection">
                <div class="section-header">
                    <h2>Events</h2>
                    <button class="btn" style="width: auto;" onclick="openEventModal()">Add Event</button>
                </div>
                <div class="card">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Icon</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="eventTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Equipment Modal -->
    <div class="modal" id="equipmentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="equipmentModalTitle">Add Equipment</h3>
                <button class="close-btn" onclick="closeEquipmentModal()">&times;</button>
            </div>
            <form id="equipmentForm">
                <input type="hidden" id="equipmentId">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="equipmentName" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="equipmentCategory" required></select>
                </div>
                <div class="form-group">
                    <label>Icon (emoji)</label>
                    <input type="text" id="equipmentIcon" placeholder="📡">
                </div>
                <div class="form-group">
                    <label>Image</label>
                    <input type="file" id="equipmentImage" accept="image/*">
                    <div class="image-preview" id="equipmentImagePreview">
                        <span>No image selected</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="equipmentDescription" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Price</label>
                    <input type="text" id="equipmentPrice" placeholder="Price on enquiry">
                </div>
                <div class="form-group">
                    <label>Specifications</label>
                    <textarea id="equipmentSpecifications" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="equipmentFeatured"> Featured
                    </label>
                </div>
                <button type="submit" class="btn">Save</button>
            </form>
        </div>
    </div>

    <!-- Category Modal -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="categoryModalTitle">Add Category</h3>
                <button class="close-btn" onclick="closeCategoryModal()">&times;</button>
            </div>
            <form id="categoryForm">
                <input type="hidden" id="categoryId">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="categoryName" required>
                </div>
                <div class="form-group">
                    <label>Icon (emoji)</label>
                    <input type="text" id="categoryIcon" placeholder="📽">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="categoryDescription" rows="3"></textarea>
                </div>
                <button type="submit" class="btn">Save</button>
            </form>
        </div>
    </div>

    <!-- Event Modal -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="eventModalTitle">Add Event</h3>
                <button class="close-btn" onclick="closeEventModal()">&times;</button>
            </div>
            <form id="eventForm">
                <input type="hidden" id="eventId">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="eventName" required>
                </div>
                <div class="form-group">
                    <label>Icon (emoji)</label>
                    <input type="text" id="eventIcon" placeholder="💼">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="eventDescription" rows="3"></textarea>
                </div>
                <button type="submit" class="btn">Save</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let token = localStorage.getItem('token');

        // Check if user is logged in
        if (token) {
            showAdminPanel();
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    token = data.token;
                    showAdminPanel();
                } else {
                    showAlert('loginAlert', data.message, 'error');
                }
            } catch (error) {
                showAlert('loginAlert', 'Server error', 'error');
            }
        });

        // Logout
        function logout() {
            localStorage.removeItem('token');
            token = null;
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
        }

        // Show admin panel
        function showAdminPanel() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadEquipment();
            loadCategories();
            loadEvents();
        }

        // Show section
        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.sidebar nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`${section}Section`).classList.add('active');
            event.target.classList.add('active');
        }

        // Show alert
        function showAlert(elementId, message, type) {
            const alert = document.getElementById(elementId);
            alert.textContent = message;
            alert.className = `alert ${type} active`;
            setTimeout(() => alert.classList.remove('active'), 3000);
        }

        // Load equipment
        async function loadEquipment() {
            try {
                const response = await fetch(`${API_URL}/equipment`);
                const equipment = await response.json();

                const tbody = document.getElementById('equipmentTable');
                tbody.innerHTML = equipment.map(item => `
                    <tr>
                        <td>${item.name}</td>
                        <td>${item.category?.name || 'N/A'}</td>
                        <td>${item.price}</td>
                        <td>
                            <div class="actions">
                                <button class="edit-btn" onclick="editEquipment('${item._id}')">Edit</button>
                                <button class="delete-btn" onclick="deleteEquipment('${item._id}')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading equipment:', error);
            }
        }

        // Load categories
        async function loadCategories() {
            try {
                const response = await fetch(`${API_URL}/categories`);
                const categories = await response.json();

                const tbody = document.getElementById('categoryTable');
                tbody.innerHTML = categories.map(cat => `
                    <tr>
                        <td>${cat.name}</td>
                        <td>${cat.icon || 'N/A'}</td>
                        <td>
                            <div class="actions">
                                <button class="edit-btn" onclick="editCategory('${cat._id}')">Edit</button>
                                <button class="delete-btn" onclick="deleteCategory('${cat._id}')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `).join('');

                // Update category select in equipment form
                const select = document.getElementById('equipmentCategory');
                select.innerHTML = categories.map(cat => `
                    <option value="${cat._id}">${cat.name}</option>
                `).join('');
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        // Load events
        async function loadEvents() {
            try {
                const response = await fetch(`${API_URL}/events`);
                const events = await response.json();

                const tbody = document.getElementById('eventTable');
                tbody.innerHTML = events.map(evt => `
                    <tr>
                        <td>${evt.name}</td>
                        <td>${evt.icon || 'N/A'}</td>
                        <td>
                            <div class="actions">
                                <button class="edit-btn" onclick="editEvent('${evt._id}')">Edit</button>
                                <button class="delete-btn" onclick="deleteEvent('${evt._id}')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }

        // Equipment modal functions
        function openEquipmentModal() {
            document.getElementById('equipmentModalTitle').textContent = 'Add Equipment';
            document.getElementById('equipmentForm').reset();
            document.getElementById('equipmentId').value = '';
            document.getElementById('equipmentImagePreview').innerHTML = '<span>No image selected</span>';
            document.getElementById('equipmentModal').classList.add('active');
        }

        function closeEquipmentModal() {
            document.getElementById('equipmentModal').classList.remove('active');
        }

        async function editEquipment(id) {
            try {
                const response = await fetch(`${API_URL}/equipment/${id}`);
                const equipment = await response.json();

                document.getElementById('equipmentModalTitle').textContent = 'Edit Equipment';
                document.getElementById('equipmentId').value = equipment._id;
                document.getElementById('equipmentName').value = equipment.name;
                document.getElementById('equipmentCategory').value = equipment.category._id;
                document.getElementById('equipmentIcon').value = equipment.icon || '';
                document.getElementById('equipmentDescription').value = equipment.description;
                document.getElementById('equipmentPrice').value = equipment.price;
                document.getElementById('equipmentSpecifications').value = equipment.specifications || '';
                document.getElementById('equipmentFeatured').checked = equipment.featured;

                if (equipment.image) {
                    document.getElementById('equipmentImagePreview').innerHTML = `<img src="http://localhost:5000${equipment.image}" alt="Equipment">`;
                }

                document.getElementById('equipmentModal').classList.add('active');
            } catch (error) {
                console.error('Error loading equipment:', error);
            }
        }

        async function deleteEquipment(id) {
            if (!confirm('Are you sure you want to delete this equipment?')) return;

            try {
                const response = await fetch(`${API_URL}/equipment/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    showAlert('alert', 'Equipment deleted successfully', 'success');
                    loadEquipment();
                } else {
                    showAlert('alert', 'Error deleting equipment', 'error');
                }
            } catch (error) {
                showAlert('alert', 'Server error', 'error');
            }
        }

        // Equipment form submit
        document.getElementById('equipmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('equipmentId').value;
            const formData = new FormData();
            formData.append('name', document.getElementById('equipmentName').value);
            formData.append('category', document.getElementById('equipmentCategory').value);
            formData.append('icon', document.getElementById('equipmentIcon').value);
            formData.append('description', document.getElementById('equipmentDescription').value);
            formData.append('price', document.getElementById('equipmentPrice').value);
            formData.append('specifications', document.getElementById('equipmentSpecifications').value);
            formData.append('featured', document.getElementById('equipmentFeatured').checked);

            const imageInput = document.getElementById('equipmentImage');
            if (imageInput.files[0]) {
                formData.append('image', imageInput.files[0]);
            }

            try {
                const url = id ? `${API_URL}/equipment/${id}` : `${API_URL}/equipment`;
                const method = id ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (response.ok) {
                    showAlert('alert', `Equipment ${id ? 'updated' : 'added'} successfully`, 'success');
                    closeEquipmentModal();
                    loadEquipment();
                } else {
                    showAlert('alert', 'Error saving equipment', 'error');
                }
            } catch (error) {
                showAlert('alert', 'Server error', 'error');
            }
        });

        // Image preview
        document.getElementById('equipmentImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('equipmentImagePreview').innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Category modal functions
        function openCategoryModal() {
            document.getElementById('categoryModalTitle').textContent = 'Add Category';
            document.getElementById('categoryForm').reset();
            document.getElementById('categoryId').value = '';
            document.getElementById('categoryModal').classList.add('active');
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.remove('active');
        }

        async function editCategory(id) {
            try {
                const response = await fetch(`${API_URL}/categories/${id}`);
                const category = await response.json();

                document.getElementById('categoryModalTitle').textContent = 'Edit Category';
                document.getElementById('categoryId').value = category._id;
                document.getElementById('categoryName').value = category.name;
                document.getElementById('categoryIcon').value = category.icon || '';
                document.getElementById('categoryDescription').value = category.description || '';

                document.getElementById('categoryModal').classList.add('active');
            } catch (error) {
                console.error('Error loading category:', error);
            }
        }

        async function deleteCategory(id) {
            if (!confirm('Are you sure you want to delete this category?')) return;

            try {
                const response = await fetch(`${API_URL}/categories/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    showAlert('alert', 'Category deleted successfully', 'success');
                    loadCategories();
                } else {
                    showAlert('alert', 'Error deleting category', 'error');
                }
            } catch (error) {
                showAlert('alert', 'Server error', 'error');
            }
        }

        // Category form submit
        document.getElementById('categoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('categoryId').value;
            const data = {
                name: document.getElementById('categoryName').value,
                icon: document.getElementById('categoryIcon').value,
                description: document.getElementById('categoryDescription').value
            };

            try {
                const url = id ? `${API_URL}/categories/${id}` : `${API_URL}/categories`;
                const method = id ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('alert', `Category ${id ? 'updated' : 'added'} successfully`, 'success');
                    closeCategoryModal();
                    loadCategories();
                } else {
                    showAlert('alert', 'Error saving category', 'error');
                }
            } catch (error) {
                showAlert('alert', 'Server error', 'error');
            }
        });

        // Event modal functions
        function openEventModal() {
            document.getElementById('eventModalTitle').textContent = 'Add Event';
            document.getElementById('eventForm').reset();
            document.getElementById('eventId').value = '';
            document.getElementById('eventModal').classList.add('active');
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        async function editEvent(id) {
            try {
                const response = await fetch(`${API_URL}/events/${id}`);
                const event = await response.json();

                document.getElementById('eventModalTitle').textContent = 'Edit Event';
                document.getElementById('eventId').value = event._id;
                document.getElementById('eventName').value = event.name;
                document.getElementById('eventIcon').value = event.icon || '';
                document.getElementById('eventDescription').value = event.description || '';

                document.getElementById('eventModal').classList.add('active');
            } catch (error) {
                console.error('Error loading event:', error);
            }
        }

        async function deleteEvent(id) {
            if (!confirm('Are you sure you want to delete this event?')) return;

            try {
                const response = await fetch(`${API_URL}/events/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    showAlert('alert', 'Event deleted successfully', 'success');
                    loadEvents();
                } else {
                    showAlert('alert', 'Error deleting event', 'error');
                }
            } catch (error) {
                showAlert('alert', 'Server error', 'error');
            }
        }

        // Event form submit
        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('eventId').value;
            const data = {
                name: document.getElementById('eventName').value,
                icon: document.getElementById('eventIcon').value,
                description: document.getElementById('eventDescription').value
            };

            try {
                const url = id ? `${API_URL}/events/${id}` : `${API_URL}/events`;
                const method = id ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('alert', `Event ${id ? 'updated' : 'added'} successfully`, 'success');
                    closeEventModal();
                    loadEvents();
                } else {
                    showAlert('alert', 'Error saving event', 'error');
                }
            } catch (error) {
                showAlert('alert', 'Server error', 'error');
            }
        });
    </script>
</body>
</html>
